<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>ACE Ops Delivery</title>
  <style>/*__THEME__*/</style>
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">ACE OPS</p>
      <h1 id="client">Loading…</h1>
      <div class="flow">Intake → BRD → Spec → Tickets → Build → Review → Release → Status &nbsp;·&nbsp; the agent drafts, people decide</div>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Data source">
        <button type="button" data-source="live" aria-pressed="false">Live intake</button>
        <button type="button" data-source="sample" aria-pressed="false">Northline sample</button>
      </div>
      <span class="chip-dark" id="local" title="Where the model runs"><span class="dot"></span><span>On this machine</span></span>
      <span class="chip-dark" id="agent"><span class="dot pulse"></span><span>Agent starting…</span></span>
      <button type="button" class="btn-dark" id="tour" title="A guided walk through every gate, on the real engine">Tour</button>
      <button type="button" class="btn-dark" id="autopilot" title="Hand the gates to the stage agents, or take them back">Autopilot</button>
      <button type="button" class="btn-dark" id="run">Run agents</button>
      <div class="persona"><label for="persona">Acting as</label><select id="persona"></select></div>
    </div>
  </header>
  <section class="pipeline" id="pipeline" aria-label="Pipeline"></section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
  <footer class="bar-bottom" id="foot"></footer>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="modal" id="modal" aria-hidden="true"><div class="box" id="modal-box" role="dialog" aria-modal="true"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <aside class="tour" id="tour-panel" aria-live="polite" hidden></aside>

  <script>
  "use strict";
  const STAGES = ["tickets", "build", "review", "release", "done"];
  const STAGE_LABEL = { tickets: "To accept", build: "Build", review: "Review", release: "Release", done: "Done" };
  const STAGE_HINT = { tickets: "G2 · role accepts", build: "agent drafts", review: "G3 · peer approves", release: "G4 · owner ships", done: "delivered" };
  const ROLE_CLASS = { "Marketing Specialist": "ms", "Data Analyst": "da", "Developer": "dev", "Project owner": "po" };
  const S = { data: null, version: -1, sync: null, tab: "specs", persona: null, filter: "all", specFilter: "all", drawer: null, editing: false, editText: "", drafts: {}, pending: false, busy: null, brd: null, feed: "all", updateEditing: false, updateText: "", form: {} };
  // Typed-but-unsent field values survive a poll re-render: keyed by ticket id + field.
  function field(tag, key, attrs) {
    const el = h(tag, Object.assign({}, attrs, { oninput: (e) => { S.form[key] = e.target.value; }, onchange: (e) => { S.form[key] = e.target.value; } }));
    if (S.form[key] !== undefined) el.value = S.form[key];
    return el;
  }

  function store(key, value) { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; } }
  S.persona = store("aceops.persona") || "Avery Park";
  S.tab = store("aceops.tab") || "specs";

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "style") el.setAttribute("style", v);
      else el.setAttribute(k, v === true ? "" : String(v));

    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }

  }
  const $ = (id) => document.getElementById(id);

  function hue(name) { let x = 0; for (const c of String(name)) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }
  function avatar(name, cls) {
    if (!name) return h("span", { class: "av", style: "background:#d9d3c9;color:#6f6a63", title: "Unassigned" }, "?");
    const initials = name.split(/\s+/).map((p) => p[0]).join("").slice(0, 2).toUpperCase();
    return h("span", { class: "av " + (cls || ""), style: cls ? null : `background:hsl(${hue(name)} 45% 42%)`, title: name }, initials);
  }
  function roleTag(role) { return h("span", { class: "role " + (ROLE_CLASS[role] || "po") }, role); }
  function ago(iso) {
    if (!iso) return "never";
    const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    if (s < 5) return "just now"; if (s < 60) return s + "s ago";
    const m = Math.round(s / 60); if (m < 60) return m + "m ago";
    const hrs = Math.round(m / 60); return hrs < 24 ? hrs + "h ago" : Math.round(hrs / 24) + "d ago";
  }
  function me() { return (S.data && S.data.team.find((p) => p.name === S.persona)) || { name: S.persona, role: "" }; }
  function isOwner() { return me().role === (S.data && S.data.owner_role); }
  function specById(id) { return S.data.specs.find((s) => s.id === id); }
  function ticketById(id) { return S.data.tickets.find((t) => t.id === id); }
  function secOf(spec) { return (spec.brd_sections || [""])[0]; }

  // ---------- markdown (text only, no HTML from data) ----------
  function inline(text) {
    const out = []; const re = /(\*\*[^*]+\*\*|`[^`]+`|_[^_]+_$)/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push(text.slice(last, m.index));
      const t = m[0];
      if (t.startsWith("**")) out.push(h("strong", null, t.slice(2, -2)));
      else if (t.startsWith("`")) out.push(h("code", null, t.slice(1, -1)));
      else out.push(h("em", null, t.slice(1, -1)));
      last = m.index + t.length;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  }
  function md(src) {
    const root = h("div", { class: "md" }); const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n"); let i = 0;
    const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      let m;
      if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) { root.append(h("h" + m[1].length, null, inline(m[2]))); i++; continue; }
      if (line.startsWith(">")) { const q = h("blockquote"); while (i < lines.length && lines[i].startsWith(">")) { q.append(h("div", null, inline(lines[i].replace(/^>\s?/, "")))); i++; } root.append(q); continue; }
      if (line.trim().startsWith("|")) {
        const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i]); i++; }
        const table = h("table"); const head = cells(rows[0]);
        table.append(h("thead", null, h("tr", null, head.map((c) => h("th", null, c)))));
        const body = h("tbody");
        rows.slice(1).filter((r) => !/^\|?\s*-{2,}/.test(r.trim().replace(/^\|/, ""))).forEach((r) => body.append(h("tr", null, cells(r).map((c) => h("td", { class: c.startsWith("≈") ? "derived" : null }, c)))));
        table.append(body); root.append(table); continue;
      }
      if (/^\s*[-*]\s+/.test(line)) { const ul = h("ul"); while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { const t = lines[i].replace(/^\s*[-*]\s+/, ""); ul.append(h("li", null, t.startsWith("[ ] ") ? ["☐ ", ...inline(t.slice(4))] : t.startsWith("[x] ") ? ["☑ ", ...inline(t.slice(4))] : inline(t))); i++; } root.append(ul); continue; }
      if (/^\s*\d+\.\s+/.test(line)) { const ol = h("ol"); while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { ol.append(h("li", null, inline(lines[i].replace(/^\s*\d+\.\s+/, "")))); i++; } root.append(ol); continue; }
      const para = []; while (i < lines.length && lines[i].trim() && !/^(#|>|\||\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) { para.push(lines[i]); i++; }
      root.append(h("p", null, inline(para.join(" "))));
    }
    return root;
  }

  // ---------- api ----------
  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-ACE-Console": "1" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
    const ct = res.headers.get("content-type") || "";
    const payload = ct.includes("json") ? await res.json() : await res.text();
    if (!res.ok) { const detail = payload && payload.detail; throw new Error(Array.isArray(detail) ? detail.map((d) => d.msg).join("; ") : (detail || res.statusText)); }
    return payload;
  }
  async function act(key, method, path, body, okMsg) {
    if (S.busy) return;
    S.busy = key; paintBusy();

      const view = await api(method, path, Object.assign({ actor: S.persona }, body || {}));
      S.form = {};
      apply(view, true);
      if (okMsg) toast(okMsg);
      return true;
    } catch (e) { toast(e.message, true); return false; }
    finally { S.busy = null; paintBusy(); }
  }
  function paintBusy() { document.querySelectorAll("[data-busy]").forEach((b) => b.classList.toggle("busy", b.dataset.busy === S.busy)); }
  function toast(msg, err) {

  }

  function apply(view, force) {

    S.data = view; S.version = view.version; S.sync = view.agent.last_sync;
    if (!view.team.some((p) => p.name === S.persona)) S.persona = view.team[0].name;
    if (!changed) { paintAgent(); return; }
    const active = document.activeElement;
    if (!force && active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT") && active.closest("#drawer, #main, #modal")) { S.pending = true; paintAgent(); return; }
    render();
  }
  document.addEventListener("focusout", () => setTimeout(() => { if (S.pending && !(document.activeElement && ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName))) { S.pending = false; render(); } }, 50));

  async function poll() {
    try { apply(await api("GET", "/api/state")); } catch (e) { paintAgent(e.message); }
    setTimeout(poll, 2000);
  }

  // ---------- render ----------
  function render() {
    paintHeader(); paintPipeline(); paintTabs(); paintMain(); paintDrawer(); paintFoot(); paintBusy();
  }
  function paintHeader() {
    const d = S.data; $("client").textContent = d.client_name;
    document.querySelectorAll("[data-source]").forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.source === d.source)); b.title = d.sources[b.dataset.source] ? "" : "No data yet for this source"; });
    const sel = $("persona"); sel.replaceChildren(...d.team.map((p) => h("option", { value: p.name, selected: p.name === S.persona }, `${p.name} · ${p.role}`)));
    const local = $("local"); const a = d.agent;

    local.replaceChildren(h("span", { class: "dot" + (a.error ? " bad" : "") }), h("span", null, label));
    local.title = a.error || (a.base_url ? `Model endpoint ${a.base_url} (loopback only)` : "Runs entirely on this machine. Set INTERNAL_LLM_BASE_URL to a 127.0.0.1 model to add model polish.");
    const ap = $("autopilot");
    ap.replaceChildren(h("span", { class: "dot" + (d.autopilot ? " pulse" : " warn") }), h("span", null, d.autopilot ? "Autopilot on" : "Autopilot off"));
    ap.classList.toggle("on", !!d.autopilot);
    paintAgent();
  }
  function paintAgent(err) {
    const el = $("agent"); if (!el) return;
    el.replaceChildren(h("span", { class: "dot pulse" + (err ? " bad" : "") }), h("span", null, err ? "Agent unreachable" : `Agent live · synced ${ago(S.sync)}`));
  }
  function paintPipeline() {

    const cnt = (st) => T.filter((t) => t.stage === st).length;
    const approved = specs.filter((s) => s.status === "approved").length;
    const status = d.status || {}; const gaps = (status.open_gaps || []).length;
    const sent = status.client_update && status.client_update.approval;
    const tiles = [
      { key: "intake", l: "Intake", n: `${d.intake.answered}/${d.intake.total}`, s: d.intake.priority_gate_done ? "priority items in" : "priority items open", p: d.intake.total ? d.intake.answered / d.intake.total : 0, tab: "brd" },
      { key: "brd", l: "BRD", n: d.intake.work_items, s: `${d.intake.gaps} gap(s) · work items`, p: d.intake.brd ? 1 : 0, tab: "brd", alert: d.intake.gaps > 0 },
      { key: "spec", l: "Spec", g: "G1", n: `${approved}/${specs.length}`, s: specs.length - approved ? `${specs.length - approved} awaiting owner` : "all approved", p: specs.length ? approved / specs.length : 0, tab: "specs" },
      { key: "tickets", l: "Tickets", g: "G2", n: cnt("tickets"), s: `${T.filter((t) => t.stage === "tickets" && !t.assignee).length} unaccepted`, p: T.length ? 1 - cnt("tickets") / T.length : 0, tab: "work", stage: "tickets" },
      { key: "build", l: "Build", n: cnt("build"), s: "agent drafts ready", p: T.length ? T.filter((t) => STAGES.indexOf(t.stage) > 1).length / T.length : 0, tab: "work", stage: "build" },
      { key: "review", l: "Review", g: "G3", n: cnt("review"), s: `${T.filter((t) => t.acceptance_criteria.some((c) => c.result === "not_met")).length} failing checks`, p: T.length ? T.filter((t) => STAGES.indexOf(t.stage) > 2).length / T.length : 0, tab: "work", stage: "review", alert: T.some((t) => t.stage === "review" && t.acceptance_criteria.some((c) => c.result === "not_met")) },
      { key: "release", l: "Release", g: "G4", n: d.releases.length, s: `${cnt("release")} ready · ${cnt("done")} shipped`, p: T.length ? cnt("done") / T.length : 0, tab: "releases" },
      { key: "status", l: "Status", g: "G5", n: gaps, s: sent ? "update sent" : "update ready to send", p: sent ? 1 : 0.5, tab: "update", alert: gaps > 0 && !sent },
    ];
    $("pipeline").replaceChildren(...tiles.map((t) => h("button", { type: "button", class: "stage" + (t.p >= 1 ? " done" : "") + (t.alert ? " alert" : ""), "aria-current": String(S.tab === t.tab && (!t.stage || S.filterStage === t.stage)), onclick: () => { setTab(t.tab); if (t.stage) { S.filterStage = t.stage; } } },
      h("div", { class: "l" }, h("span", null, t.l), t.g ? h("span", { class: "gate" }, t.g) : null),
      h("div", { class: "n" }, t.n), h("div", { class: "s" }, t.s), h("div", { class: "meter" }, h("i", { style: `width:${Math.round(Math.min(1, t.p) * 100)}%` })))));
  }
  function setTab(tab) { S.tab = tab; store("aceops.tab", tab); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  function paintTabs() {
    const d = S.data; const drafts = d.specs.filter((s) => s.status === "draft").length;
    const mine = myPlate().length; const ready = new Set(d.tickets.filter((t) => t.stage === "release").map((t) => t.spec_id)).size;
    const tabs = [["specs", "Specs", drafts, drafts > 0], ["work", "Work", mine, mine > 0], ["releases", "Releases", ready, ready > 0], ["update", "Client update", (d.status && d.status.open_gaps.length) || 0, false], ["data", "Data room", (d.datasets || []).length || null, false], ["activity", "Activity", null], ["brd", "BRD", null]];
    const kids = tabs.map(([k, l, c, hot]) => h("button", { role: "tab", "aria-selected": String(S.tab === k), onclick: () => setTab(k) }, l, c !== null && c !== undefined ? h("span", { class: "count" + (hot ? " hot" : "") }, c) : null));

    if (S.tab === "work") {
      const roles = ["all", "mine", "Marketing Specialist", "Data Analyst", "Developer"];
      kids.push(h("div", { class: "filters" }, roles.map((r) => h("button", { type: "button", class: "pill", "aria-pressed": String(S.filter === r), onclick: () => { S.filter = r; render(); } }, r === "all" ? "Everyone" : r === "mine" ? `My plate (${myPlate().length})` : r)),
        h("select", { class: "pill", onchange: (e) => { S.specFilter = e.target.value; render(); } }, h("option", { value: "all" }, "All specs"), ...d.specs.filter((s) => s.status === "approved").map((s) => h("option", { value: s.id, selected: S.specFilter === s.id }, `${s.id} ${s.title}`)))));
    }
    if (S.tab === "activity") kids.push(h("div", { class: "filters" }, ["all", "agent", "people"].map((f) => h("button", { type: "button", class: "pill", "aria-pressed": String(S.feed === f), onclick: () => { S.feed = f; render(); } }, f === "all" ? "Everything" : f === "agent" ? "Agent" : "People"))));
    $("tabs").replaceChildren(...kids);
  }
  function myPlate() {
    const p = me(); if (!S.data) return [];
    if (p.role === S.data.owner_role) return S.data.tickets.filter((t) => t.stage === "release");
    return S.data.tickets.filter((t) => t.stage !== "done" && ((t.assignee === p.name) || (t.role === p.role && t.stage === "tickets" && !t.assignee) || (t.role === p.role && t.stage === "review" && t.assignee !== p.name)));
  }
  function paintMain() {
    const main = $("main"); const d = S.data;
    if (!d.intake.work_items) {
      main.replaceChildren(h("div", { class: "empty card" }, h("h3", null, "Waiting for intake"), h("p", null, "The agent drafts specs as soon as the client's AI starts answering the checklist through the intake MCP server."),
        h("div", { class: "actions", style: "justify-content:center;margin-top:14px" }, h("button", { class: "btn gold", onclick: () => switchSource("sample") }, "Open the Northline sample"), h("button", { class: "btn", onclick: () => act("run", "POST", "/api/agent/run", {}, "Agent ran.") }, "Check again"))));

    main.replaceChildren(view());
  }

  // ---------- specs ----------
  function viewSpecs() {
    const d = S.data;
    if (!d.specs.length) return h("div", { class: "empty" }, h("h3", null, "No specs yet"), h("p", null, "A spec appears for every BRD section with at least one answered item."));
    return h("div", { class: "grid-specs" }, d.specs.map(specCard));
  }
  function acRow(c) {
    const mark = { met: "✓", not_met: "!", needs_human: "?" }[c.result] || { agent_check: "A", human_review: "H", client_confirmation: "C" }[c.verified_by];
    return h("div", { class: "ac" }, h("span", { class: "ic " + (c.result || c.verified_by), title: c.verified_by.replace("_", " ") }, mark), h("span", null, h("span", { class: "mono", style: "color:var(--faint)" }, c.id + " "), c.text, c.note ? h("span", { class: "note" }, c.note) : null));
  }
  function specCard(s) {
    const sec = secOf(s); const T = S.data.tickets.filter((t) => t.spec_id === s.id); const done = T.filter((t) => t.stage === "done").length;
    const foot = h("div", { class: "spec-foot" });
    if (s.status === "draft") {
      foot.append(h("button", { class: "btn ok", "data-busy": "approve-" + s.id, onclick: () => act("approve-" + s.id, "POST", `/api/specs/${s.id}/approve`, {}, `${s.id} approved. The agent split it into tickets.`) }, "Approve", h("span", { class: "k" }, "G1")),
        h("button", { class: "btn danger", onclick: () => rejectModal(s) }, "Reject…"), h("span", { class: "grow" }),
        h("span", { class: "hint" }, isOwner() ? "You're the project owner." : `Only the project owner approves. You're ${me().role}.`));
    } else if (s.status === "approved") {
      foot.append(h("div", { class: "grow" }, h("div", { class: "sub", style: "margin-bottom:4px" }, `${done}/${T.length} tickets delivered · approved by ${s.approval.by} ${ago(s.approval.at)}`), h("div", { class: "bar" }, h("i", { style: `width:${T.length ? Math.round(done / T.length * 100) : 0}%` }))),
        h("button", { class: "btn", onclick: () => { S.specFilter = s.id; S.filter = "all"; setTab("work"); } }, "Open tickets →"));
    } else {
      foot.append(h("span", { class: "hint" }, `Rejected by ${s.rejection && s.rejection.by}: ${s.rejection && s.rejection.reason}. The agent is revising it.`));
    }
    return h("article", { class: "card spec" },
      h("div", { class: "spec-top" }, h("span", { class: "sec", style: `background:var(--sec-${sec})` }, sec), h("div", null, h("h3", null, s.title), h("div", { class: "sub" }, h("span", { class: "mono" }, `${s.id} · v${s.version}`), " · lead ", s.role, s.client_signoff_required ? " · client sign-off at release" : "")), h("span", { class: "status st-" + s.status }, s.status)),
      h("div", { class: "goal" }, s.goal),
      h("div", { class: "cols" }, h("div", { class: "block" }, h("h4", null, `Scope · ${s.scope.length}`), h("ul", null, s.scope.map((x) => h("li", null, x)))), h("div", { class: "block" }, h("h4", null, "Acceptance criteria"), s.acceptance_criteria.map(acRow))),
      s.inputs_needed_from_client.length ? h("div", { class: "block needs" }, h("h4", null, `Waiting on the client · ${s.inputs_needed_from_client.length}`), h("ul", null, s.inputs_needed_from_client.map((n) => h("li", null, h("strong", null, n.source_item_id + " "), n.question)))) : null,
      h("div", { class: "chips" }, h("span", { class: "sub" }, "Traces to"), s.source_item_ids.map((i) => h("span", { class: "chip mono" }, i)), s.depends_on.length ? [h("span", { class: "sub", style: "margin-left:6px" }, "after"), s.depends_on.map((x) => h("span", { class: "chip mono" }, x))] : null),
      s.risks.length ? h("div", null, s.risks.map((r) => h("div", { class: "risk" }, "⚑ " + r))) : null,
