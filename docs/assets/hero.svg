<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="t d">
  <title id="t">ACE Ops: local-first delivery agent</title>
  <desc id="d">A dawn horizon in cream, copper and umber with the ACE OPS wordmark.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e9d2"/>
      <stop offset=".16" stop-color="#ecd4ae"/>
      <stop offset=".34" stop-color="#d9ad78"/>
      <stop offset=".50" stop-color="#b57a45"/>
      <stop offset=".60" stop-color="#6b3f22"/>
      <stop offset=".74" stop-color="#36200f"/>
      <stop offset="1" stop-color="#120c08"/>
    </linearGradient>
    <radialGradient id="sun" cx="76%" cy="36%" r="55%">
      <stop offset="0" stop-color="#fff6e3" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#f3d6a6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f3d6a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="14%" cy="78%" r="60%">
      <stop offset="0" stop-color="#2a170b" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2a170b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2dc" stop-opacity="0"/>
      <stop offset=".4" stop-color="#fff2dc" stop-opacity=".75"/>
      <stop offset=".62" stop-color="#fff2dc" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff2dc" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="640" fill="url(#sky)"/>
  <rect width="1600" height="640" fill="url(#sun)"/>
  <rect width="1600" height="640" fill="url(#shade)"/>
  <rect x="0" y="361" width="1600" height="3" fill="url(#horizon)" filter="url(#blur)"/>
  <g font-family="Work Sans, Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="345" font-size="150" font-weight="500" fill="#ffffff" letter-spacing="52" filter="url(#glow)" opacity=".95">ACE OPS</text>
    <text x="800" y="345" font-size="150" font-weight="500" fill="#ffffff" letter-spacing="52">ACE OPS</text>
    <text x="800" y="420" font-size="22" font-weight="400" fill="#fff4e4" letter-spacing="9" opacity=".92">THE ALWAYS-ON DELIVERY AGENT FOR AGENCIES</text>
    <text x="800" y="462" font-size="16" font-weight="400" fill="#f3dfc2" letter-spacing="3" opacity=".85">Your client's AI answers the brief. Our agent drafts the work. People approve it. Nothing leaves the box.</text>
  </g>
  <g font-family="Work Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#e8d5b8" letter-spacing="3" opacity=".8">
    <text x="48" y="600">RUNS ON DELL PRO MAX GB10 · ALL INFERENCE LOCAL</text>
    <text x="1552" y="600" text-anchor="end">INTAKE → BRD → SPEC → TICKETS → BUILD → REVIEW → RELEASE → STATUS</text>
  </g>
</svg>
